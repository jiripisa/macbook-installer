style = "bg:color_blue"
format = '[](fg:color_blue)[ $symbol( $version)( \($virtualenv\)) ](fg:color_fg0 bg:color_blue)[](fg:color_blue)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[](fg:color_bg3)[ $symbol( $context) ](fg:#83a598 bg:color_bg3)[](fg:color_bg3)'

[conda]

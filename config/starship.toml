format = '[](fg:color_bg3)[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)[](fg:color_bg3)'

[cmd_duration]
min_time = 1000
style = "bg:color_bg1"
format = '[](fg:color_bg1)[ $duration ](fg:color_fg0 bg:color_bg1)[](fg:color_bg1)'

[time]
disabled = true

[line_break]
disabled = false

[character]
